name: Bash Syntax Check

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Reject CRLF line endings
        run: |
          if git ls-files --eol | grep "i/crlf"; then
            echo "These files are stored with CRLF; Bash cannot run them on Linux or macOS." >&2
            exit 1
          fi

      - name: Check bash syntax
        run: |
          find . -name "*.sh" -exec bash -n {} \;

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -exec shellcheck {} \;

      - name: Test agent.sync
        run: bash tests/agent.sync.test.sh

      - name: Test agent.notify
        run: bash tests/agent.notify.test.sh

      - name: Test platform routing
        run: bash tests/platform.test.sh

      - name: Test caffeinate
        run: bash tests/caffeinate.test.sh

      - name: Test claude
        run: bash tests/claude.test.sh

      - name: Test gpg
        run: bash tests/gpg.test.sh

      - name: Test backup and restore
        run: bash tests/backup-restore.test.sh

      - name: Test branch and branch.description
        run: bash tests/branch.description.test.sh

      - name: Test laravel.fix-permission
        run: bash tests/laravel.fix-permission.test.sh

      - name: Test claude.guard
        run: bash tests/claude.guard.test.sh
